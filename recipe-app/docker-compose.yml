services:
  recipe-app:
    build: .
    container_name: recipe-app
    restart: always
    volumes:
      # Read-only: the app only ever reads notes, never writes.
      - "C:/Sharing/Second Brain/Recipes:/data/recipes:ro"
    environment:
      RECIPES_DIR: /data/recipes

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: recipe-app-tunnel
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - recipe-app
